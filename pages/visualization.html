   ===================================================================== */
function selectDS(id) {
  stopPlay();
  currentDS = id;
  currentState = initState(id);
  frames = [];
  frameIdx = 0;
  currentAction = null;
  renderDSList();
  renderActions();
  renderViz(currentState);
  renderRight();
  document.getElementById('stepMsg').style.display = 'none';
  document.getElementById('stepDescPanel').textContent = 'Click an action to see step-by-step explanation.';
}

/* =====================================================================
   DO ACTION
   ===================================================================== */
function doAction(action) {
  stopPlay();
  currentAction = action;

  const inputEl = document.getElementById('actInput');
  const indexEl = document.getElementById('actIndex');
  let val = inputEl ? (parseInt(inputEl.value) || Math.floor(Math.random()*90)+10) : 0;
  let idx = indexEl ? (parseInt(indexEl.value)) : 0;

  // Audio Buffer Mode toggle
  if (action === 'toggleAudioMode') {
    currentState.overwriteMode = !currentState.overwriteMode;
    frames = [];
    frameIdx = 0;
    renderActions();
    renderViz(currentState);
    document.getElementById('stepDescPanel').textContent = currentState.overwriteMode
      ? '🔊 Audio Buffer Mode ON — when full, the oldest sample is overwritten (lossy, like real-time audio streaming).'
      : '🔇 Normal Mode — Enqueue is rejected when the queue is full.';
    updateStepInfo();
    return;
  }

  // Reset action
  if (action === 'reset') {
    currentState = initState(currentDS);
    frames = [{ state: JSON.parse(JSON.stringify(currentState)), msg: 'Reset to initial state.', hl: -1 }];
    frameIdx = 0;
    renderViz(currentState);
    showMsg('Reset to initial state.');
    renderRight();
    updateStepInfo();
    return;
  }

  frames = generateFrames(currentDS, action, currentState, val, idx);
  frameIdx = 0;

  if (frames.length > 0) {
    applyFrame(frames[0]);
    updateStepInfo();
    renderRight();
  }
}

/* =====================================================================
   FRAME GENERATION
   ===================================================================== */
function generateFrames(dsId, action, state, val, idx) {
  const s = () => JSON.parse(JSON.stringify(state));
  const st = s();

  if (dsId === 'array') return genArrayFrames(action, st, val, idx);
  if (dsId === 'arraylist') return genArrayListFrames(action, st, val, idx);
  if (dsId === 'linkedlist') return genLinkedListFrames(action, st, val, idx);
  if (dsId === 'stack') return genStackFrames(action, st, val);
  if (dsId === 'queue') return genQueueFrames(action, st, val);
  if (dsId === 'deque') return genDequeFrames(action, st, val);
  if (dsId === 'circqueue') return genCircQueueFrames(action, st, val);
  if (dsId === 'bfs') return genBFSFrames(st);
  if (dsId === 'dfs') return genDFSFrames(st);
  if (dsId === 'dijkstra') return genDijkstraFrames(st);
  if (dsId === 'heap') return genHeapFrames(action, st, val);
  return [];
}

function frame(state, msg, hl) {
  return { state: JSON.parse(JSON.stringify(state)), msg, hl: hl || -1 };
}

/* --- ARRAY --- */
function genArrayFrames(action, st, val, idx) {
  const F = [];
  if (action === 'add') {
    if (st.items.length >= st.capacity) return [frame(st,'❌ Array is full! Cannot add.',-1)];
    const i = st.items.length;
    st.hl = [i]; F.push(frame(st,`Step 1: Found empty slot at index [${i}]`,1));
    st.items.push(val); st.newIdx = i; st.hl = [];
    F.push(frame(st,`Step 2: Stored ${val} at arr[${i}]`,2));
    st.newIdx = -1; F.push(frame(st,`✓ Added ${val}! size = ${st.items.length}`,3));
  } else if (action === 'remove') {
    if (!st.items.length) return [frame(st,'❌ Array is empty!',-1)];
    const at = isNaN(idx) || idx < 0 ? st.items.length - 1 : Math.min(idx, st.items.length - 1);
    const v = st.items[at];
    st.hl = [at]; F.push(frame(st,`Step 1: Found ${v} at arr[${at}]. Will shift left.`,1));
    st.delIdx = at; st.hl = []; F.push(frame(st,`Step 2: Removing arr[${at}] = ${v}`,2));
    st.items.splice(at, 1); st.delIdx = -1;
    F.push(frame(st,`✓ Removed ${v} at index ${at}. size = ${st.items.length}`,3));
  } else if (action === 'insert') {
    if (st.items.length >= st.capacity) return [frame(st,'❌ Array is full!',-1)];
    idx = isNaN(idx) || idx < 0 ? 0 : Math.min(idx, st.items.length);
    F.push(frame(st,`Step 1: Insert ${val} at index ${idx}. Need to shift right.`,1));
    for (let i = st.items.length; i > idx; i--) {
      const ts = JSON.parse(JSON.stringify(st));
      ts.hl = [i-1,i]; ts.items = [...st.items]; ts.items.splice(i,0,undefined);
      F.push(frame(ts,`Shifting arr[${i-1}] → arr[${i}]`,2));
    }
    st.items.splice(idx,0,val); st.newIdx = idx; st.hl = [];
    F.push(frame(st,`Step 3: Placed ${val} at arr[${idx}]`,3));
    st.newIdx = -1; F.push(frame(st,`✓ Insert done! size = ${st.items.length}`,4));
  } else if (action === 'delete') {
    if (!st.items.length) return [frame(st,'❌ Array empty!',-1)];
    idx = isNaN(idx) || idx < 0 ? 0 : Math.min(idx, st.items.length-1);
    const v = st.items[idx];
    st.hl = [idx]; F.push(frame(st,`Step 1: Found ${v} at arr[${idx}]. Shifting left.`,1));
    st.delIdx = idx; F.push(frame(st,`Step 2: Removing arr[${idx}]`,2));
    st.items.splice(idx,1); st.delIdx = -1; st.hl = [];
    F.push(frame(st,`✓ Deleted ${v}. size = ${st.items.length}`,3));
  }
  currentState = st;
  return F;
}

/* --- ARRAYLIST --- */
function genArrayListFrames(action, st, val, idx) {
  const F = [];
  if (action === 'add') {
    if (st.items.length >= st.capacity) {
      const oldCap = st.capacity;
      st.resizing = true;
      F.push(frame(st,`Step 1: size(${st.items.length}) == capacity(${oldCap}). Need to resize!`,1));
      st.capacity *= 2;
      F.push(frame(st,`Step 2: New array allocated — capacity doubled to ${st.capacity}`,2));
      st.resizing = false;
    }
    const i = st.items.length;
    st.hl = [i]; F.push(frame(st,`Step 3: Adding ${val} at index ${i}`,3));
    st.items.push(val); st.newIdx = i; st.hl = [];
    F.push(frame(st,`✓ Added ${val}. size=${st.items.length} capacity=${st.capacity}`,4));
    st.newIdx = -1;
  } else if (action === 'remove') {
    if (!st.items.length) return [frame(st,'❌ Empty!',-1)];
    idx = isNaN(idx) || idx < 0 ? 0 : Math.min(idx, st.items.length-1);
    const v = st.items[idx];
    st.delIdx = idx; F.push(frame(st,`Step 1: Removing ${v} at index ${idx}. Shifting left…`,1));
    st.items.splice(idx,1); st.delIdx = -1;
    if (st.items.length < st.capacity/4 && st.capacity > 4) st.capacity = Math.max(4, st.capacity/2);
    F.push(frame(st,`✓ Removed ${v}. size=${st.items.length} capacity=${st.capacity}`,2));
  }
  currentState = st;
  return F;
}

/* --- LINKED LIST --- */
function genLinkedListFrames(action, st, val, idx) {
  const F = [];
  if (action === 'addHead') {
    F.push(frame(st,`Step 1: Create new node(${val})`,1));
    st.newIdx = 0;
    st.nodes.unshift({v:val});
    F.push(frame(st,`Step 2: new.next = head; head = new node(${val})`,2));
    st.newIdx = -1; F.push(frame(st,`✓ Node ${val} added at head.`,3));
  } else if (action === 'addTail') {
    const n = st.nodes.length;
    for (let i = 0; i < n; i++) {
      st.hl = [i]; F.push(frame(st,`Step ${i+1}: Traversing... at node ${st.nodes[i].v}`,1));
    }
    st.hl = [];
    st.nodes.push({v:val}); st.newIdx = st.nodes.length-1;
    F.push(frame(st,`Step ${n+1}: curr.next = new node(${val})`,2));
    st.newIdx = -1; F.push(frame(st,`✓ Node ${val} added at tail.`,3));
  } else if (action === 'removeHead') {
    if (!st.nodes.length) return [frame(st,'❌ List is empty!',-1)];
    const v = st.nodes[0].v;
    st.hl = [0]; F.push(frame(st,`Step 1: Found head = ${v}`,1));
    st.delIdx = 0; F.push(frame(st,`Step 2: head = head.next; Remove node(${v})`,2));
    st.nodes.shift(); st.delIdx = -1; st.hl = [];
    F.push(frame(st,`✓ Removed head ${v}.`,3));
  } else if (action === 'removeTail') {
    if (!st.nodes.length) return [frame(st,'❌ List is empty!',-1)];
    const n = st.nodes.length;
    for (let i = 0; i < n-1; i++) {
      st.hl = [i]; F.push(frame(st,`Traversing to second-last: node ${st.nodes[i].v}`,1));
    }
    st.hl = [n-1]; st.delIdx = n-1;
    F.push(frame(st,`Step ${n}: prev.next = null; Remove tail(${st.nodes[n-1].v})`,2));
    st.nodes.pop(); st.delIdx = -1; st.hl = [];
    F.push(frame(st,`✓ Tail removed.`,3));
  }
  currentState = st;
  return F;
}

/* --- STACK --- */
function genStackFrames(action, st, val) {
  const F = [];
  if (action === 'push') {
    if (st.items.length >= 7) return [frame(st,'❌ Stack full!',-1)];
    F.push(frame(st,`Step 1: Check if stack is full (size=${st.items.length})`,1));
    st.items.push(val); st.newTop = true;
    F.push(frame(st,`Step 2: Push ${val} onto top. top = ${st.items.length-1}`,2));
    st.newTop = false; F.push(frame(st,`✓ Push done! Stack size = ${st.items.length}`,3));
  } else if (action === 'pop') {
    if (!st.items.length) return [frame(st,'❌ Stack underflow!',-1)];
    const v = st.items[st.items.length-1];
    st.hl = [st.items.length-1]; F.push(frame(st,`Step 1: Peek top = ${v}`,1));
    st.delTop = true; F.push(frame(st,`Step 2: Remove top element ${v}`,2));
    st.items.pop(); st.delTop = false; st.hl = [];
    F.push(frame(st,`✓ Popped ${v}. Stack size = ${st.items.length}`,3));
  } else if (action === 'peek') {
    if (!st.items.length) return [frame(st,'❌ Stack is empty!',-1)];
    const v = st.items[st.items.length-1];
    st.hl = [st.items.length-1];
    F.push(frame(st,`Peek: Top element is ${v} (no removal)`,1));
    st.hl = []; F.push(frame(st,`✓ Peek done! Top = ${v}`,2));
  }
  currentState = st;
  return F;
}

/* --- QUEUE --- */
function genQueueFrames(action, st, val) {
  const F = [];
  if (action === 'enqueue') {
    if (st.items.length >= st.capacity) return [frame(st,'❌ Queue full!',-1)];
    const r = st.items.length;
    F.push(frame(st,`Step 1: rear = ${r}. Enqueue ${val} at rear`,1));
    st.items.push(val); st.newIdx = st.items.length-1;
    F.push(frame(st,`Step 2: queue[rear]=${val}; rear++; size++`,2));
    st.newIdx = -1; F.push(frame(st,`✓ Enqueued ${val}. size=${st.items.length}`,3));
  } else if (action === 'dequeue') {
    if (!st.items.length) return [frame(st,'❌ Queue empty!',-1)];
    const v = st.items[0];
    st.hl = [0]; F.push(frame(st,`Step 1: front = 0. Dequeue ${v} from front`,1));
    st.delIdx = 0; F.push(frame(st,`Step 2: value=${v}; front++; size--`,2));
    st.items.shift(); st.delIdx = -1; st.hl = [];
    F.push(frame(st,`✓ Dequeued ${v}. size=${st.items.length}`,3));
  } else if (action === 'peek') {
    if (!st.items.length) return [frame(st,'❌ Queue empty!',-1)];
    st.hl = [0]; F.push(frame(st,`Peek: Front element is ${st.items[0]}`,1));
    st.hl = []; F.push(frame(st,`✓ Front = ${st.items[0]}`,2));
  }
  currentState = st;
  return F;
}

/* --- DEQUE --- */
function genDequeFrames(action, st, val) {
  const F = [];
  if (action === 'addFront') {
    F.push(frame(st,`Step 1: front = (front-1+cap)%cap; Add ${val} at front`,1));
    st.items.unshift(val); st.newFront = true;
    F.push(frame(st,`Step 2: deque[front]=${val}; size++`,2));
    st.newFront = false; F.push(frame(st,`✓ Added ${val} at front. size=${st.items.length}`,3));
  } else if (action === 'addRear') {
    F.push(frame(st,`Step 1: Add ${val} at rear`,1));
    st.items.push(val); st.newRear = true;
    F.push(frame(st,`Step 2: deque[rear]=${val}; rear=(rear+1)%cap; size++`,2));
    st.newRear = false; F.push(frame(st,`✓ Added ${val} at rear. size=${st.items.length}`,3));
  } else if (action === 'removeFront') {
    if (!st.items.length) return [frame(st,'❌ Deque empty!',-1)];
    const v = st.items[0];
    st.delFront = true; F.push(frame(st,`Step 1: Remove front = ${v}`,1));
    st.items.shift(); st.delFront = false;
    F.push(frame(st,`✓ Removed front ${v}. size=${st.items.length}`,2));
  } else if (action === 'removeRear') {
    if (!st.items.length) return [frame(st,'❌ Deque empty!',-1)];
    const v = st.items[st.items.length-1];
    st.delRear = true; F.push(frame(st,`Step 1: Remove rear = ${v}`,1));
    st.items.pop(); st.delRear = false;
    F.push(frame(st,`✓ Removed rear ${v}. size=${st.items.length}`,2));
  }
  currentState = st;
  return F;
}

/* --- CIRCULAR QUEUE --- */
function genCircQueueFrames(action, st, val) {
  const F = [];
  if (action === 'enqueue') {
    if (st.size >= st.capacity) {
      if (!st.overwriteMode) return [frame(st,'❌ Circular Queue full! Enable Audio Buffer Mode to overwrite oldest.',-1)];

      // Audio Buffer Mode: overwrite oldest (drop front, advance pointers)
      const overwrittenVal = st.items[0];
      const overSlot = st.front;
      st.overIdx = overSlot;
      F.push(frame(st,`[Audio Buffer] Buffer full! Oldest sample at slot[${overSlot}]=${overwrittenVal} will be dropped`,1));
      st.front = (st.front + 1) % st.capacity; st.items.shift(); st.size--;
      st.overIdx = -1;
      F.push(frame(st,`Step 2: Dropped oldest=${overwrittenVal}; front advanced to ${st.front}`,2));
      const newRear = (st.rear + 1) % st.capacity;
      st.rear = newRear; st.newIdx = newRear; st.items.push(val); st.size++;
      F.push(frame(st,`Step 3: slots[${newRear}]=${val}; size=${st.size} (buffer full, circular)`,3));
      st.newIdx = -1;
      F.push(frame(st,`✓ [Overwrite] Enqueued ${val} at slot ${newRear}. Oldest ${overwrittenVal} was dropped.`,4));
    } else {
      const newRear = (st.rear + 1) % st.capacity;
      F.push(frame(st,`Step 1: rear=(${st.rear}+1)%${st.capacity}=${newRear}; Check not full`,1));
      st.rear = newRear; st.newIdx = newRear; st.items.push(val); st.size++;
      F.push(frame(st,`Step 2: slots[${newRear}]=${val}; size=${st.size}`,2));
      st.newIdx = -1; F.push(frame(st,`✓ Enqueued ${val} at slot ${newRear}`,3));
    }
  } else if (action === 'dequeue') {
    if (st.size <= 0) return [frame(st,'❌ Circular Queue empty!',-1)];
    const v = st.items[0];
    const oldFront = st.front;
    st.delIdx = oldFront;
    F.push(frame(st,`Step 1: front=${oldFront}; Dequeue slots[${oldFront}]=${v}`,1));
    st.front = (st.front + 1) % st.capacity; st.items.shift(); st.size--;
    st.delIdx = -1;
    F.push(frame(st,`Step 2: front=(${oldFront}+1)%${st.capacity}=${st.front}; size=${st.size}`,2));
    F.push(frame(st,`✓ Dequeued ${v}. front=${st.front}`,3));
  }
  currentState = st;
  return F;
}

/* --- BFS --- */
function genBFSFrames(st) {
  const F = [];
  const G = buildGraph();
  const adj = G.adj;

  // Line 2: visited = new Set()  |  Line 3: queue = new Queue()
  st.visited = []; st.queued = []; st.current = -1; st.visitOrder = [];
  F.push(frame(st, `Initialize: visited = {}, queue = []`, 2));

  // Line 5-6: enqueue start AND mark visited (BFS marks visited at ENQUEUE time)
  const visited = new Set([0]);
  const queue = [0];
  st.visited = [0];      // ← visited updated at enqueue time
  st.queued = [0];
  F.push(frame(st, `Enqueue A, mark A visited. visited={A}, queue=[A]`, 5));

  while (queue.length) {
    // Line 8: while queue is not empty
    F.push(frame(st, `queue=[${queue.map(n=>G.nodes[n].label).join(',')}] not empty — enter loop`, 8));

    // Line 9: node = queue.dequeue()  |  Line 10: process(node)
    const node = queue.shift();
    st.current = node;
    st.visitOrder.push(node);  // process order tracked separately
    st.queued = [...queue];
    F.push(frame(st, `Dequeue ${G.nodes[node].label}. Process it. queue=[${queue.map(n=>G.nodes[n].label).join(',')||'empty'}]`, 9));

    // Line 12: for neighbor in graph[node]
    const neighbors = adj[node] || [];
    if (neighbors.length) {
      F.push(frame(st, `Check neighbors of ${G.nodes[node].label}: [${neighbors.map(n=>G.nodes[n].label).join(',')}]`, 12));
    }
    for (const nb of neighbors) {
      if (!visited.has(nb)) {
        // Line 14-15: visited.add + enqueue — mark visited NOW at enqueue time
        visited.add(nb);
        queue.push(nb);
        st.visited.push(nb);   // ← visited updated at enqueue time
        st.queued = [...queue];
        F.push(frame(st, `${G.nodes[nb].label} not in visited → mark visited & enqueue. visited={${[...visited].map(i=>G.nodes[i].label).join(',')}}`, 14));
      } else {
        // Line 13: already in visited — skip
        F.push(frame(st, `${G.nodes[nb].label} already in visited set — skip`, 13));
      }
    }
  }

  st.current = -1;
  F.push(frame(st, `✓ BFS done! Process order: ${st.visitOrder.map(n=>G.nodes[n].label).join(' → ')}`, -1));
  currentState = st;
  return F;
}

/* --- DFS --- */
function genDFSFrames(st) {
  const F = [];
  const G = buildGraph();
  const adj = G.adj;

  // Line 2: visited = new Set()  |  Line 3: stack = new Stack()
  st.visited = []; st.stack = [0]; st.current = -1; st.visitOrder = [];
  F.push(frame(st, `Initialize: visited = {}, stack = []`, 2));

  // Line 5: stack.push(start)
  const visited = new Set();
  const stack = [0];
  st.stack = [0];
  F.push(frame(st, `Push start A onto stack. Stack: [A]`, 5));

  while (stack.length) {
    // Line 7: while stack is not empty
    F.push(frame(st, `Stack [${[...stack].reverse().map(n=>G.nodes[n].label).join(',')}] not empty — continue`, 7));

    // Line 8: node = stack.pop()
    const node = stack.pop();
    st.stack = [...stack];

    // Line 9: if node not in visited
    if (visited.has(node)) {
      F.push(frame(st, `Pop ${G.nodes[node].label} — already visited, skip`, 9));
      continue;
    }

    // Line 10: visited.add(node)  |  Line 11: process(node)
    visited.add(node);
    st.visited.push(node); st.current = node; st.visitOrder = [...st.visited];
    F.push(frame(st, `Pop ${G.nodes[node].label}: mark visited, process it. Stack: [${stack.map(n=>G.nodes[n].label).join(',')||'empty'}]`, 10));

    // Line 13: for neighbor  |  Line 15: stack.push(neighbor)
    const pushed = [];
    const neighbors = (adj[node] || []).slice().reverse();
    for (const nb of neighbors) {
      if (!visited.has(nb)) { stack.push(nb); pushed.push(nb); }
    }
    st.stack = [...stack];
    if (pushed.length) {
      F.push(frame(st, `Push neighbors of ${G.nodes[node].label}: [${pushed.map(n=>G.nodes[n].label).join(',')}]. Stack: [${[...stack].reverse().map(n=>G.nodes[n].label).join(',')}]`, 15));
    }
  }

  // Done
  st.current = -1;
  F.push(frame(st, `✓ DFS complete! Visit order: ${st.visitOrder.map(n=>G.nodes[n].label).join(' → ')}`, -1));
  currentState = st;
  return F;
}

/* --- HEAP --- */
function genHeapFrames(action, st, val) {
  const F = [];
  if (action === 'insert') {
    st.items.push(val); let i = st.items.length - 1;
    st.newIdx = i; st.hl = [i];
    F.push(frame(st,`Step 1: Insert ${val} at end (index ${i}). Heap array: [${st.items.join(',')}]`,1));
    while (i > 0) {
      const parent = Math.floor((i-1)/2);
      st.hl = [i, parent];
      F.push(frame(st,`Compare heap[${i}]=${st.items[i]} with parent heap[${parent}]=${st.items[parent]}`,2));
      if (st.items[parent] > st.items[i]) {
        st.swapA = i; st.swapB = parent;
        F.push(frame(st,`heap[${parent}]=${st.items[parent]} > heap[${i}]=${st.items[i]}: Swap!`,3));
        const tmp = st.items[i]; st.items[i] = st.items[parent]; st.items[parent] = tmp;
        st.swapA = -1; st.swapB = -1;
        i = parent;
        F.push(frame(st,`After swap: [${st.items.join(',')}]`,3));
      } else {
        F.push(frame(st,`heap[${parent}] ≤ heap[${i}]: Heap property satisfied. Stop.`,4));
        break;
      }
    }
    st.hl = []; st.newIdx = -1;
    F.push(frame(st,`✓ Insert done! Min-Heap: [${st.items.join(',')}]`,5));
  } else if (action === 'extractMin') {
    if (!st.items.length) return [frame(st,'❌ Heap empty!',-1)];
    const min = st.items[0];
    st.hl = [0]; F.push(frame(st,`Step 1: Min = heap[0] = ${min}`,1));
    const last = st.items[st.items.length-1];
    st.items[0] = last; st.items.pop(); st.delIdx = 0;
    F.push(frame(st,`Step 2: Move last(${last}) to root. Remove last. Heap: [${st.items.join(',')}]`,2));
    st.delIdx = -1;
    let i = 0;
    while (true) {
      const l = 2*i+1, r = 2*i+2;
      let sm = i;
      if (l < st.items.length && st.items[l] < st.items[sm]) sm = l;
      if (r < st.items.length && st.items[r] < st.items[sm]) sm = r;
      if (sm === i) {
        F.push(frame(st,`heap[${i}] ≤ both children. Stop.`,4));
        break;
      }
      st.swapA = i; st.swapB = sm; st.hl = [i,sm];
      F.push(frame(st,`heap[${i}]=${st.items[i]} > child[${sm}]=${st.items[sm]}: Swap!`,3));
      const tmp = st.items[i]; st.items[i] = st.items[sm]; st.items[sm] = tmp;
      st.swapA = -1; st.swapB = -1; i = sm;
      F.push(frame(st,`After swap: [${st.items.join(',')}]`,3));
    }
    st.hl = [];
    F.push(frame(st,`✓ Extracted min=${min}. Heap: [${st.items.join(',')}]`,5));
  }
  currentState = st;
  return F;
}

/* =====================================================================
   APPLY FRAME
   ===================================================================== */
function applyFrame(f) {
  if (!f) return;
  renderViz(f.state);
  showMsg(f.msg);
  document.getElementById('stepDescPanel').innerHTML = `<b>Step ${frameIdx+1}/${frames.length}:</b> ${f.msg}`;
  if (currentAction) renderRight(f.hl);
}

/* =====================================================================
   STEP CONTROLS
   ===================================================================== */
function stepForward() {
  if (!frames.length) return;
  frameIdx = Math.min(frameIdx+1, frames.length-1);
  applyFrame(frames[frameIdx]);
  updateStepInfo();
}
function stepBack() {
  if (!frames.length) return;
  frameIdx = Math.max(frameIdx-1, 0);
  applyFrame(frames[frameIdx]);
  updateStepInfo();
}
function togglePlay() {
  if (playing) stopPlay();
  else startPlay();
}
function startPlay() {
  if (!frames.length) return;
  playing = true;
  const btn = document.getElementById('playBtn');
  if (btn) btn.textContent = '⏸ Pause';
  function tick() {
    if (frameIdx >= frames.length-1) { stopPlay(); return; }
    frameIdx++;
    applyFrame(frames[frameIdx]);
    updateStepInfo();
    playTimer = setTimeout(tick, getSpeed());
  }
  playTimer = setTimeout(tick, getSpeed());
}
function stopPlay() {
  playing = false;
  clearTimeout(playTimer);
  const btn = document.getElementById('playBtn');
  if (btn) btn.textContent = '▶ Play';
}
function updateStepInfo() {
  const el = document.getElementById('stepInfo');
  if (el) el.textContent = frames.length ? `Step ${frameIdx+1} / ${frames.length}` : 'No steps yet';
}

/* =====================================================================
   SHOW MESSAGE
   ===================================================================== */
function showMsg(msg) {
  const el = document.getElementById('stepMsg');
  el.style.display = 'block';
  el.textContent = msg;
}

/* =====================================================================
   RENDER RIGHT PANEL
   ===================================================================== */
function renderRight(hlLine) {
  const content = document.getElementById('pseudoContent');
  if (currentTab === 'cx') {
    const rows = COMPLEXITY[currentDS] || [];
    let h = `<div class="complexity-box"><div class="cx-title">Time & Space Complexity</div>`;
    rows.forEach(r => {
      h += `<div class="cx-row"><span>${r.op}</span><span class="${r.cc}">${r.tc}</span></div>`;
    });
    h += `</div>`;
    content.innerHTML = h;
    return;
  }

  const pc = PSEUDOCODES[currentDS];
  if (!pc) { content.innerHTML = '<div style="color:var(--muted);font-size:12px">No pseudocode available.</div>'; return; }

  let code = '';
  if (currentAction && pc[currentAction]) {
    code = pc[currentAction];
  } else {
    // Show first pseudocode
    code = Object.values(pc)[0];
  }

  // Render as code block with line numbers
  const lines = code.split('\n');
  let h = `<div class="code-block">`;
  lines.forEach((line, i) => {
    const isHl = hlLine !== undefined && hlLine !== null && hlLine !== -1 && Math.floor(hlLine) === i+1;
    h += `<span class="code-line${isHl?' hl':''}">${line}</span>`;
  });
  h += `</div>`;

  // Also show complexity mini box
  const rows = (COMPLEXITY[currentDS] || []).slice(0, 3);
  h += `<div class="complexity-box"><div class="cx-title">Key Complexities</div>`;
  rows.forEach(r => {
    h += `<div class="cx-row"><span>${r.op}</span><span class="${r.cc}">${r.tc}</span></div>`;
  });
  h += `</div>`;

  content.innerHTML = h;
}

/* =====================================================================
   RENDER VISUALIZATIONS
   ===================================================================== */
function renderViz(state) {
  const container = document.getElementById('vizContainer');
  switch(currentDS) {
    case 'array': container.innerHTML = renderArray(state); break;
    case 'arraylist': container.innerHTML = renderArrayList(state); break;
    case 'linkedlist': container.innerHTML = renderLinkedList(state); break;
    case 'stack': container.innerHTML = renderStack(state); break;
    case 'queue': container.innerHTML = renderQueue(state); break;
    case 'deque': container.innerHTML = renderDeque(state); break;
    case 'circqueue': container.innerHTML = renderCircQueue(state); break;
    case 'bfs': container.innerHTML = renderGraph(state, 'bfs'); break;
    case 'dfs': container.innerHTML = renderGraph(state, 'dfs'); break;
    case 'dijkstra': container.innerHTML = renderDijkstra(state); break;
    case 'heap': container.innerHTML = renderHeap(state); break;
    default: break;
  }
}

/* --- ARRAY render --- */
function renderArray(st) {
  let h = `<div class="vis-array-wrap"><div style="font-size:12px;color:var(--muted);margin-bottom:8px">Array — size: <b style="color:var(--text)">${st.items.length}</b> / capacity: <b style="color:var(--text)">${st.capacity}</b></div><div class="vis-arr">`;
  for (let i = 0; i < st.capacity; i++) {
    const empty = i >= st.items.length;
    let cls = 'arr-box';
    if (empty) cls += ' empty';
    if (!empty && st.hl && st.hl.includes(i)) cls += ' hl';
    if (i === st.newIdx) cls += ' new';
    if (i === st.delIdx) cls += ' del';
    h += `<div class="arr-cell"><div class="${cls}">${empty ? '' : st.items[i]}</div><div class="arr-idx">${i}</div></div>`;
  }
  h += `</div></div>`;
  return h;
}

/* --- ARRAYLIST render --- */
function renderArrayList(st) {
  let h = `<div class="vis-array-wrap">`;
  if (st.resizing) {
    h += `<div style="font-size:12px;color:var(--amber);margin-bottom:6px;animation:pulse 1s infinite">⚡ Resizing... allocating new array!</div>`;
  }
  h += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">ArrayList — size: <b style="color:var(--text)">${st.items.length}</b> / capacity: <b style="color:var(--text)">${st.capacity}</b></div><div class="vis-arr">`;
  for (let i = 0; i < st.capacity; i++) {
    const empty = i >= st.items.length;
    let cls = 'arr-box';
    if (empty) cls += ' empty';
    if (!empty && st.hl && st.hl.includes(i)) cls += ' hl';
    if (i === st.newIdx) cls += ' new';
    if (i === st.delIdx) cls += ' del';
    h += `<div class="arr-cell"><div class="${cls}">${empty ? '' : st.items[i]}</div><div class="arr-idx">${i}</div></div>`;
  }
  h += `</div>`;
  // Capacity bar
  const pct = Math.round((st.items.length / st.capacity) * 100);
  const barColor = pct >= 75 ? 'var(--red)' : pct >= 50 ? 'var(--orange)' : 'var(--green)';
  h += `<div style="width:100%;max-width:${st.capacity*54}px;margin-top:10px">
    <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Fill ratio: ${pct}%</div>
    <div style="height:6px;background:var(--dark3);border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:all .4s"></div>
    </div>
  </div>`;
  h += `</div>`;
  return h;
}

/* --- LINKED LIST render --- */
function renderLinkedList(st) {
  let h = `<div class="vis-ll">`;
  st.nodes.forEach((node, i) => {
    let cls = 'll-box';
    if (st.hl && st.hl.includes(i)) cls += ' hl';
    if (i === st.newIdx) cls += ' new';
    if (i === st.delIdx) cls += ' del';
    const isHead = i === 0, isTail = i === st.nodes.length - 1;
    h += `<div class="ll-node-wrap">
      <div class="ll-node">
        <div class="${cls}">
          <div class="ll-data">${node.v}</div>
          <div class="ll-ptr">→</div>
        </div>
        ${i < st.nodes.length-1 ? '<div class="ll-arrow"></div>' : '<div class="ll-null">null</div>'}
      </div>
      <div class="ll-lbl">${isHead?'head':''}${isHead&&isTail?'/':''}${isTail&&!isHead?'tail':''}</div>
    </div>`;
  });
  if (!st.nodes.length) {
    h += `<div style="color:var(--muted);font-size:13px;font-style:italic">head → null (empty list)</div>`;
  }
  h += `</div>`;
  return h;
}

/* --- STACK render --- */
function renderStack(st) {
  let h = `<div class="vis-stack-wrap">`;
  if (!st.items.length) {
    h += `<div class="stack-empty">Empty Stack</div>`;
  } else {
    for (let i = st.items.length-1; i >= 0; i--) {
      const isTop = i === st.items.length-1;
      let cls = 'stack-cell';
      if (isTop) cls += ' top';
      if (isTop && st.newTop) cls += ' new';
      if (isTop && st.delTop) cls += ' del';
      h += `<div class="${cls}">${st.items[i]}${isTop ? '<div class="stack-top-tag"></div>' : ''}</div>`;
    }
  }
  h += `<div class="stack-base"></div>`;
  h += `<div style="font-size:11px;color:var(--muted);margin-top:10px">Size: <b style="color:var(--text)">${st.items.length}</b></div>`;
  h += `</div>`;
  return h;
}

/* --- QUEUE render --- */
function renderQueue(st) {
  let h = `<div class="vis-queue-wrap">`;
  const cap = Math.max(st.capacity, st.items.length);
  h += `<div style="font-size:11px;color:var(--muted)">FRONT → &nbsp;&nbsp;&nbsp;&nbsp; → REAR</div>`;
  h += `<div class="queue-row">`;
  for (let i = 0; i < cap; i++) {
    const empty = i >= st.items.length;
    let cls = 'q-cell';
    if (empty) cls += ' empty-slot';
    if (!empty && i === 0) cls += ' front';
    if (!empty && i === st.items.length-1) cls += ' rear';
    if (i === st.newIdx) cls += ' new';
    if (i === st.delIdx) cls += ' del';
    h += `<div class="${cls}">${empty ? '' : st.items[i]}</div>`;
  }
  h += `</div><div class="ptr-row">`;
  for (let i = 0; i < cap; i++) {
    const isFront = !st.hl || i === 0;
    const isRear = i === st.items.length-1;
    let cls = 'ptr-cell';
    if (i === 0 && st.items.length > 0) cls += ' fp';
    if (i === st.items.length-1 && st.items.length > 0) cls += ' rp';
    h += `<div class="${cls}">${i === 0 && st.items.length > 0 ? '▲ F' : i === st.items.length-1 && st.items.length > 0 ? '▲ R' : ''}</div>`;
  }
  h += `</div><div style="font-size:11px;color:var(--muted)">Size: <b style="color:var(--text)">${st.items.length}</b></div>`;
  h += `</div>`;
  return h;
}

/* --- DEQUE render --- */
function renderDeque(st) {
  let h = `<div class="vis-deque-wrap">`;
  h += `<div class="dq-labels"><span class="dq-lbl fl">◀ FRONT</span><span class="dq-lbl rl">REAR ▶</span></div>`;
  h += `<div class="deque-row">`;
  if (!st.items.length) {
    h += `<div style="padding:14px 24px;border:2px dashed rgba(20,184,166,.2);border-radius:8px;color:var(--muted);font-size:12px">Empty Deque</div>`;
  } else {
    st.items.forEach((v, i) => {
      const isFront = i === 0, isRear = i === st.items.length-1;
      let cls = 'dq-cell';
      if (isFront) cls += ' front';
      if (isRear && !isFront) cls += ' rear';
      if (isFront && st.newFront) cls += ' new';
      if (isRear && st.newRear) cls += ' new';
      if (isFront && st.delFront) cls += ' del';
      if (isRear && st.delRear) cls += ' del';
      h += `<div class="${cls}">${v}</div>`;
    });
  }
  h += `</div><div style="font-size:11px;color:var(--muted)">Size: <b style="color:var(--text)">${st.items.length}</b></div>`;
  h += `</div>`;
  return h;
}

/* --- CIRCULAR QUEUE render --- */
function renderCircQueue(st) {
  const R = 130, cx = 200, cy = 185, n = st.capacity;
  const nodeR = 26;
  let svg = `<div class="vis-circ">`;

  // Audio Buffer Mode banner
  if (st.overwriteMode) {
    const isFull = st.size >= st.capacity;
    const bannerColor = isFull ? 'rgba(234,179,8,.18)' : 'rgba(16,185,129,.12)';
    const borderColor = isFull ? '#eab308' : '#10b981';
    const label = isFull ? '🔊 Audio Buffer — FULL (next enqueue overwrites oldest)' : '🔊 Audio Buffer Mode — overwrite oldest when full';
    svg += `<div style="margin-bottom:8px;padding:6px 12px;background:${bannerColor};border:1px solid ${borderColor};border-radius:6px;font-size:11px;font-weight:600;color:${borderColor};text-align:center">${label}</div>`;
  }

  svg += `<svg class="circ-svg" width="400" height="370" viewBox="0 0 400 370">`;

  // Draw circle guide — amber ring in audio buffer mode when full
  const ringStroke = (st.overwriteMode && st.size >= st.capacity) ? 'rgba(234,179,8,.4)' : 'rgba(236,72,153,.15)';
  svg += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${ringStroke}" stroke-width="${(st.overwriteMode && st.size >= st.capacity) ? 3 : 2}" stroke-dasharray="6,4"/>`;

  for (let i = 0; i < n; i++) {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    const nx = cx + R * Math.cos(angle);
    const ny = cy + R * Math.sin(angle);

    const inUse = i < st.items.length;
    const physicalIdx = (st.front + i) % n;
    const isFront = i === 0 && st.items.length > 0;
    const isRear = i === st.items.length-1 && st.items.length > 0;
    const isNew = i === st.items.length-1 && st.newIdx !== -1;
    const isDel = i === 0 && st.delIdx !== -1;
    const isOver = physicalIdx === st.overIdx && st.overIdx !== -1;

    let fill = 'rgba(236,72,153,.1)';
    let stroke = 'rgba(236,72,153,.25)';
    let textColor = '#64748b';
    let strokeWidth = 2;
    if (inUse) { fill = 'rgba(236,72,153,.2)'; stroke = 'rgba(236,72,153,.6)'; textColor = '#f1f5f9'; }
    if (isFront) { fill = 'rgba(245,158,11,.3)'; stroke = '#f59e0b'; }
    if (isRear) { fill = 'rgba(249,115,22,.3)'; stroke = '#f97316'; }
    if (isNew) { fill = 'rgba(16,185,129,.35)'; stroke = '#10b981'; }
    if (isDel) { fill = 'rgba(239,68,68,.3)'; stroke = '#ef4444'; }
    if (isOver) { fill = 'rgba(234,179,8,.4)'; stroke = '#eab308'; strokeWidth = 3; textColor = '#fff'; }

    svg += `<circle cx="${nx}" cy="${ny}" r="${nodeR}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
    svg += `<text x="${nx}" y="${ny+1}" text-anchor="middle" dominant-baseline="middle" fill="${textColor}" font-size="13" font-weight="700">${inUse ? st.items[i] : ''}</text>`;
    svg += `<text x="${nx}" y="${ny+nodeR+12}" text-anchor="middle" fill="#475569" font-size="9">[${physicalIdx}]</text>`;

    if (isFront) svg += `<text x="${nx}" y="${ny-nodeR-6}" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">FRONT</text>`;
    if (isRear && !isFront) svg += `<text x="${nx}" y="${ny-nodeR-6}" text-anchor="middle" fill="#f97316" font-size="10" font-weight="700">REAR</text>`;
    if (isOver) svg += `<text x="${nx}" y="${ny-nodeR-6}" text-anchor="middle" fill="#eab308" font-size="10" font-weight="700">DROP</text>`;
  }

  // Center label
  const centerLabel = st.overwriteMode ? '🔊' : 'Circular';
  svg += `<text x="${cx}" y="${cy-18}" text-anchor="middle" fill="${st.overwriteMode ? '#eab308' : '#475569'}" font-size="${st.overwriteMode ? 18 : 11}">${centerLabel}</text>`;
  svg += `<text x="${cx}" y="${cy+4}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="700">${st.size}/${st.capacity}</text>`;
  svg += `<text x="${cx}" y="${cy+22}" text-anchor="middle" fill="#475569" font-size="10">size/capacity</text>`;
  svg += `</svg>`;

  // Items list
  svg += `<div style="margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px">
    <span style="color:var(--muted)">Buffer:</span>
    ${st.items.map((v,i) => {
      const isNewest = i === st.items.length - 1 && st.newIdx !== -1;
      const bg = isNewest ? 'rgba(16,185,129,.25)' : 'rgba(236,72,153,.15)';
      const border = isNewest ? 'rgba(16,185,129,.6)' : 'rgba(236,72,153,.3)';
      return `<span style="padding:3px 8px;background:${bg};border:1px solid ${border};border-radius:5px;color:#f1f5f9;font-weight:700">${v}</span>`;
    }).join('')}
    ${!st.items.length ? '<span style="color:var(--muted);font-style:italic">empty</span>' : ''}
  </div>`;

  // Legend for audio buffer mode
  if (st.overwriteMode) {
    svg += `<div style="margin-top:6px;display:flex;gap:10px;font-size:10px;color:var(--muted);flex-wrap:wrap">
      <span><span style="color:#f59e0b;font-weight:700">■</span> Front (oldest)</span>
      <span><span style="color:#f97316;font-weight:700">■</span> Rear (newest)</span>
      <span><span style="color:#10b981;font-weight:700">■</span> Just written</span>
      <span><span style="color:#eab308;font-weight:700">■</span> Overwritten/Dropped</span>
    </div>`;
  }

  svg += `</div>`;
  return svg;
}

/* --- GRAPH render (BFS/DFS) --- */
function renderGraph(st, type) {
  const G = buildGraph();
  const svgW = 620, svgH = 380;
  const R = 16;
  let svg = `<div class="vis-graph"><svg class="graph-svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">`;

  const ds = type === 'bfs' ? (st.queued||[]) : (st.stack||[]);
  const nodeColor = (id) => {
    const inVis = st.visited && st.visited.includes(id);
    const inDs  = ds.includes(id);
    if (id === st.current)            return { fill:'#78350f', stroke:'#f59e0b', text:'#fef3c7' }; // yellow — processing
    if (inVis && inDs && type==='bfs') return { fill:'#0e7490', stroke:'#22d3ee', text:'#e0f2fe' }; // teal — in visited set, waiting in queue
    if (inVis)                         return { fill:'#14532d', stroke:'#22c55e', text:'#bbf7d0' }; // green — processed
    if (inDs)                          return { fill:'#1e3a5f', stroke:'#3b82f6', text:'#bfdbfe' }; // blue — on stack (DFS)
    return { fill:'rgba(30,41,59,.8)', stroke:'rgba(51,65,85,.5)', text:'#475569' };                 // grey — unvisited
  };

  // Level guide lines
  const levels = [{y:38,lbl:'L0'},{y:112,lbl:'L1'},{y:188,lbl:'L2'},{y:262,lbl:'L3'},{y:332,lbl:'L4'}];
  levels.forEach(({y,lbl}) => {
    svg += `<line x1="0" y1="${y}" x2="${svgW}" y2="${y}" stroke="rgba(51,65,85,.18)" stroke-width="1" stroke-dasharray="4,4"/>`;
    svg += `<text x="6" y="${y-4}" fill="rgba(100,116,139,.5)" font-size="9" font-family="monospace">${lbl}</text>`;
  });

  // Edges
  G.edges.forEach(([a,b]) => {
    const na = G.nodes[a], nb = G.nodes[b];
    const bothVisited = st.visited && st.visited.includes(a) && st.visited.includes(b);
    svg += `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="${bothVisited?'#10b981':'rgba(100,116,139,.3)'}" stroke-width="${bothVisited?2:1.5}"/>`;
  });

  // Nodes
  G.nodes.forEach(n => {
    const c = nodeColor(n.id);
    svg += `<circle cx="${n.x}" cy="${n.y}" r="${R}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="2"/>`;
    svg += `<text x="${n.x}" y="${n.y+1}" text-anchor="middle" dominant-baseline="middle" fill="${c.text}" font-size="12" font-weight="700">${n.label}</text>`;
  });

  svg += `</svg>`;

  // Legend
  if (type === 'bfs') {
    svg += `<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:10px;margin-top:-4px">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#22d3ee;display:inline-block"></span>In visited set + queue</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block"></span>Processing</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block"></span>Processed</span>
    </div>`;
  } else {
    svg += `<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:10px;margin-top:-4px">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#3b82f6;display:inline-block"></span>On Stack</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block"></span>Processing</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block"></span>Visited</span>
    </div>`;
  }

  // Queue/Stack display
  const dsLabel = type === 'bfs' ? 'Queue' : 'Stack';
  svg += `<div class="traversal-queue"><span class="tq-label">${dsLabel}:</span>`;
  if (ds && ds.length) {
    ds.forEach(id => {
      svg += `<span class="tq-item" style="background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.3);color:var(--blue)">${G.nodes[id].label}</span>`;
    });
  } else {
    svg += `<span style="color:var(--muted);font-size:11px;font-style:italic">empty</span>`;
  }
  svg += `</div>`;

  // Visited Set (updates at enqueue time for BFS, at pop time for DFS)
  svg += `<div class="visited-order"><span class="vo-label">${type==='bfs'?'Visited Set:':'Visited:'}</span>`;
  if (st.visited && st.visited.length) {
    st.visited.forEach(id => { svg += `<span class="vo-item">${G.nodes[id].label}</span>`; });
  } else {
    svg += `<span style="color:var(--muted);font-size:11px;font-style:italic">none yet</span>`;
  }
  svg += `</div>`;

  // For BFS: also show processing order (nodes actually dequeued so far)
  if (type === 'bfs') {
    svg += `<div class="visited-order" style="margin-top:4px"><span class="vo-label" style="color:#22c55e">Process Order:</span>`;
    if (st.visitOrder && st.visitOrder.length) {
      st.visitOrder.forEach(id => { svg += `<span class="vo-item" style="background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#86efac">${G.nodes[id].label}</span>`; });
    } else {
      svg += `<span style="color:var(--muted);font-size:11px;font-style:italic">none yet</span>`;
    }
    svg += `</div>`;
  }

  svg += `</div>`;
  return svg;
}

/* --- HEAP render --- */
function renderHeap(st) {
  const items = st.items;
  const n = items.length;
  const svgW = 560, svgH = 300;
  const nodeR = 22;

  // Compute positions: level, position in level
  const positions = [];
  for (let i = 0; i < n; i++) {
    const level = Math.floor(Math.log2(i+1));
    const levelStart = Math.pow(2, level) - 1;
    const posInLevel = i - levelStart;
    const totalInLevel = Math.pow(2, level);
    const xSpacing = svgW / (totalInLevel + 1);
    const x = xSpacing * (posInLevel + 1);
    const y = 40 + level * 80;
    positions.push({ x, y });
  }

  let svg = `<div class="vis-heap"><svg class="heap-svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">`;

  // Edges
  for (let i = 0; i < n; i++) {
    const l = 2*i+1, r = 2*i+2;
    if (l < n) svg += `<line x1="${positions[i].x}" y1="${positions[i].y}" x2="${positions[l].x}" y2="${positions[l].y}" stroke="rgba(251,146,60,.3)" stroke-width="1.5"/>`;
    if (r < n) svg += `<line x1="${positions[i].x}" y1="${positions[i].y}" x2="${positions[r].x}" y2="${positions[r].y}" stroke="rgba(251,146,60,.3)" stroke-width="1.5"/>`;
  }

  // Nodes
  for (let i = 0; i < n; i++) {
    const p = positions[i];
    let fill = 'rgba(251,146,60,.15)', stroke = 'rgba(251,146,60,.4)', textC = '#f1f5f9';
    if (st.hl && st.hl.includes(i)) { fill='rgba(59,130,246,.3)'; stroke='#3b82f6'; }
    if (i === st.newIdx) { fill='rgba(16,185,129,.3)'; stroke='#10b981'; }
    if (i === st.delIdx) { fill='rgba(239,68,68,.25)'; stroke='#ef4444'; }
    if (i === st.swapA || i === st.swapB) { fill='rgba(245,158,11,.4)'; stroke='#f59e0b'; }
    if (i === 0) { textC = '#fbbf24'; }
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${nodeR}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    svg += `<text x="${p.x}" y="${p.y+1}" text-anchor="middle" dominant-baseline="middle" fill="${textC}" font-size="13" font-weight="700">${items[i]}</text>`;
    svg += `<text x="${p.x}" y="${p.y+nodeR+12}" text-anchor="middle" fill="#475569" font-size="9">[${i}]</text>`;
  }

  if (!n) {
    svg += `<text x="${svgW/2}" y="${svgH/2}" text-anchor="middle" fill="#475569" font-size="14">Empty Heap</text>`;
  }
  svg += `</svg>`;

  // Array representation
  svg += `<div class="heap-arr"><span class="ha-lbl">Array:</span>`;
  items.forEach((v, i) => {
    let cls = 'ha-cell';
    if (st.hl && st.hl.includes(i)) cls += ' hl';
    if (i === st.newIdx) cls += ' new';
    if (i === st.delIdx) cls += ' del';
    if (i === st.swapA || i === st.swapB) cls += ' swap';
    svg += `<div class="${cls}" title="index ${i}">${v}</div>`;
  });
  if (!items.length) svg += `<span style="color:var(--muted);font-size:11px;font-style:italic">empty</span>`;
  svg += `</div>`;

  if (items.length) {
    svg += `<div style="font-size:11px;color:var(--muted)">Min = <b style="color:#fbbf24">${items[0]}</b> (root) &nbsp;|&nbsp; Size = <b style="color:var(--text)">${items.length}</b></div>`;
  }
  svg += `</div>`;
  return svg;
}

/* --- DIJKSTRA city graph --- */
function buildCityGraph() {
  const nodes = [
    {id:0,  name:'Mumbai',    short:'Mum', x:82,  y:215},
    {id:1,  name:'Jaipur',   short:'Jai', x:192, y:68},
    {id:2,  name:'Delhi',    short:'Del', x:285, y:40},
    {id:3,  name:'Agra',     short:'Agr', x:302, y:102},
    {id:4,  name:'Indore',   short:'Ind', x:180, y:172},
    {id:5,  name:'Bhopal',   short:'Bho', x:222, y:192},
    {id:6,  name:'Nagpur',   short:'Nag', x:278, y:216},
    {id:7,  name:'Varanasi', short:'Var', x:378, y:118},
    {id:8,  name:'Patna',    short:'Pat', x:434, y:80},
    {id:9,  name:'Kolkata',  short:'Kol', x:528, y:118},
    {id:10, name:'Pune',     short:'Pun', x:106, y:258},
    {id:11, name:'Hyderabad',short:'Hyd', x:240, y:276},
    {id:12, name:'Bengaluru',short:'Blr', x:166, y:316},
    {id:13, name:'Chennai',  short:'Chn', x:330, y:308},
    {id:14, name:'Vizag',    short:'Viz', x:412, y:244},
  ];
  const edges = [
    [0,1,8],[0,4,6],[0,10,3],
    [1,2,3],[1,3,4],
    [2,3,2],[2,7,7],
    [3,5,5],
    [4,5,2],
    [5,6,4],
    [6,7,6],[6,11,5],
    [7,8,3],
    [8,9,4],
    [9,14,8],
    [10,11,6],
    [11,12,6],[11,13,5],[11,14,6],
    [12,13,3],
    [13,14,5],
  ];
  const adj = {};
  nodes.forEach(n => { adj[n.id] = []; });
  edges.forEach(([a,b,w]) => { adj[a].push({to:b,w}); adj[b].push({to:a,w}); });
  return { nodes, edges, adj };
}

function genDijkstraFrames(st) {
  const F = [];
  const CG = buildCityGraph();
  const { nodes, edges, adj } = CG;
  const N = nodes.length;
  const INF = 1e9;

  const dist = Array(N).fill(INF); dist[0] = 0;
  const prev = Array(N).fill(-1);
  const settled = [];
  const settledSet = new Set();
  let pq = [{d:0, id:0}];

  const snap = (cur, relaxed, path, vars) => JSON.parse(JSON.stringify({
    nodes, edges,
    dist: dist.map(d => d >= INF ? -1 : d),
    prev: [...prev],
    visited: [...settled],
    current: cur,
    pq: [...pq],
    relaxed: relaxed || [],
    path: path || [],
    vars: vars || null,
  }));

  // Line 2: dist init  |  Line 5: pq.enqueue(0, source)
  F.push({state: snap(-1,[],[],{phase:'init'}), msg:`Init: dist[Mumbai]=0, all others=∞. Enqueue (0,Mumbai) into PQ`, hl:2});
  F.push({state: snap(-1,[],[],{phase:'init'}), msg:`PQ = [(0,Mumbai)]. Ready to start.`, hl:5});

  while (pq.length > 0) {
    // Line 7: while pq not empty
    F.push({state: snap(-1,[],[],{phase:'while'}), msg:`PQ not empty [${pq.map(x=>`(${x.d},${nodes[x.id].short})`).join(', ')}] — continue`, hl:7});

    pq.sort((a,b) => a.d - b.d);
    const {d, id} = pq.shift();

    // Line 9: stale check
    if (settledSet.has(id)) {
      F.push({state: snap(-1,[],[],{phase:'stale',u:id,d}), msg:`Pop (${d},${nodes[id].name}): d=${d} > dist[u]=${dist[id]} — stale, skip`, hl:9});
      continue;
    }

    // Line 8: (d, u) = pq.dequeue_min()
    settledSet.add(id);
    settled.push(id);
    F.push({state: snap(id,[],[],{phase:'settle',u:id,d}), msg:`Dequeue min (d=${d}, u=${nodes[id].name}). Settle it.`, hl:8});

    if (id === 14) break;

    // Line 11: for (v, w) in neighbors
    F.push({state: snap(id,[],[],{phase:'neighbors',u:id,d}), msg:`u=${nodes[id].name}, dist[u]=${d}. Checking ${(adj[id]||[]).filter(e=>!settledSet.has(e.to)).length} unsettled neighbors`, hl:11});

    const relaxed = [];
    for (const {to, w} of (adj[id]||[])) {
      if (settledSet.has(to)) continue;
      // Line 12: newDist = dist[u] + w
      const nd = d + w;
      const oldDist = dist[to] < INF ? dist[to] : -1;
      F.push({state: snap(id,[],[],{phase:'compute',u:id,d,v:to,w,newDist:nd,oldDist}),
        msg:`v=${nodes[to].name}: newDist = dist[u]+w = ${d}+${w} = ${nd}`, hl:12});
      if (nd < dist[to]) {
        // Line 13-16: update dist, prev, enqueue
        dist[to] = nd;
        prev[to] = id;
        pq = pq.filter(x => x.id !== to);
        pq.push({d:nd, id:to});
        relaxed.push(to);
        F.push({state: snap(id,[to],[],{phase:'relax',u:id,d,v:to,w,newDist:nd,oldDist}),
          msg:`${nd} < ${oldDist===-1?'∞':oldDist} → dist[${nodes[to].name}]=${nd}, prev=${nodes[id].name}, enqueue (${nd},${nodes[to].name})`, hl:14});
      } else {
        F.push({state: snap(id,[],[],{phase:'noUpdate',u:id,d,v:to,w,newDist:nd,oldDist}),
          msg:`${nd} ≥ dist[${nodes[to].name}]=${oldDist===-1?'∞':oldDist} — no update`, hl:13});
      }
    }
    if (!relaxed.length) {
      F.push({state: snap(id,[],[],{phase:'neighbors',u:id,d}), msg:`${nodes[id].name}: no relaxations this round`, hl:11});
    }
  }

  // Trace shortest path
  const path = [];
  let cur = 14;
  while (cur !== -1) { path.unshift(cur); cur = prev[cur]; }

  const finalState = snap(-1, [], path, {phase:'done'});
  F.push({state: finalState, msg:`✓ Done! Shortest: ${path.map(i=>nodes[i].name).join(' → ')} = ${dist[14]} units`, hl:-1});

  currentState = F[F.length-1].state;
  return F;
}

function renderDijkstra(st) {
  if (!st || !st.nodes) {
    return `<div style="color:var(--muted);padding:40px;text-align:center">Press ▶ Mumbai → Vizag to run Dijkstra on 15 Indian cities</div>`;
  }
  const svgW = 560, svgH = 340, R = 15;
  const { nodes, edges } = st;
  const pathArr = st.path || [];
  const pathSet = new Set(pathArr);
  const pathEdges = new Set();
  for (let i = 0; i < pathArr.length-1; i++) {
    pathEdges.add(`${pathArr[i]}-${pathArr[i+1]}`);
    pathEdges.add(`${pathArr[i+1]}-${pathArr[i]}`);
  }
  const visitedSet = new Set(st.visited || []);
  const pqSet = new Set((st.pq||[]).map(x=>x.id));
  const relaxedSet = new Set(st.relaxed||[]);

  const nc = id => {
    if (pathSet.has(id)) return {f:'#164e63',s:'#06b6d4',t:'#67e8f9'};
    if (id===st.current) return {f:'#78350f',s:'#f59e0b',t:'#fef3c7'};
    if (relaxedSet.has(id)) return {f:'#7c2d12',s:'#f97316',t:'#fed7aa'};
    if (visitedSet.has(id)) return {f:'#14532d',s:'#22c55e',t:'#bbf7d0'};
    if (pqSet.has(id)) return {f:'#1e3a5f',s:'#3b82f6',t:'#bfdbfe'};
    return {f:'rgba(15,23,42,.9)',s:'rgba(71,85,105,.5)',t:'#334155'};
  };

  let svg = `<div class="vis-graph"><svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">`;

  // Edges
  edges.forEach(([a,b,w]) => {
    const na=nodes[a], nb=nodes[b];
    const onPath = pathEdges.has(`${a}-${b}`);
    const bothSettled = visitedSet.has(a)&&visitedSet.has(b);
    const sc = onPath?'#06b6d4': bothSettled?'rgba(34,197,94,.4)':'rgba(51,65,85,.35)';
    const sw = onPath?2.5: bothSettled?1.5:1;
    const mx=(na.x+nb.x)/2, my=(na.y+nb.y)/2;
    svg += `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="${sc}" stroke-width="${sw}"/>`;
    svg += `<text x="${mx}" y="${my-3}" text-anchor="middle" font-size="8" fill="${onPath?'#22d3ee':'#374151'}" font-family="sans-serif">${w}</text>`;
  });

  // Nodes
  nodes.forEach(n => {
    const c = nc(n.id);
    const d = st.dist[n.id];
    svg += `<circle cx="${n.x}" cy="${n.y}" r="${R}" fill="${c.f}" stroke="${c.s}" stroke-width="1.8"/>`;
    svg += `<text x="${n.x}" y="${n.y+1}" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="700" fill="${c.t}" font-family="sans-serif">${n.short}</text>`;
    const dStr = d===-1?'∞':d;
    const dClr = pathSet.has(n.id)?'#22d3ee': d===-1?'#1e293b':'#94a3b8';
    svg += `<text x="${n.x}" y="${n.y+R+10}" text-anchor="middle" font-size="8" fill="${dClr}" font-family="sans-serif" font-weight="700">${dStr}</text>`;
  });

  svg += `</svg>`;

  // ── Variables panel ─────────────────────────────────────
  const vr = st.vars;
  if (vr && vr.phase && vr.phase !== 'init' && vr.phase !== 'while' && vr.phase !== 'done') {
    const chip = (lbl, val, col) =>
      `<span style="display:inline-flex;flex-direction:column;align-items:center;background:rgba(15,23,42,.8);border:1px solid ${col}33;border-radius:5px;padding:3px 8px;min-width:44px">
        <span style="font-size:8px;color:#64748b;font-weight:700;letter-spacing:.5px">${lbl}</span>
        <span style="font-size:11px;font-weight:800;color:${col};font-family:monospace">${val}</span>
      </span>`;
    let varHtml = `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;padding:7px 10px;background:rgba(15,23,42,.5);border:1px solid rgba(51,65,85,.4);border-radius:8px;align-items:flex-end">`;
    varHtml += `<span style="font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;align-self:center;margin-right:4px">vars</span>`;
    if (vr.u !== undefined) varHtml += chip('u', nodes[vr.u].short, '#f59e0b');
    if (vr.d !== undefined) varHtml += chip('dist[u]', vr.d, '#10b981');
    if (vr.v !== undefined) varHtml += chip('v', nodes[vr.v].short, '#3b82f6');
    if (vr.w !== undefined) varHtml += chip('w (edge)', vr.w, '#8b5cf6');
    if (vr.newDist !== undefined) {
      const improved = vr.oldDist === -1 || vr.newDist < vr.oldDist;
      varHtml += chip('newDist', `${vr.d}+${vr.w}=${vr.newDist}`, improved ? '#22c55e' : '#ef4444');
      varHtml += chip('dist[v] was', vr.oldDist === -1 ? '∞' : vr.oldDist, '#64748b');
    }
    varHtml += `</div>`;
    svg += varHtml;
  }

  // ── dist[] chips ─────────────────────────────────────────
  svg += `<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;max-width:${svgW}px">`;
  svg += `<span style="font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;align-self:center;margin-right:3px">dist[]</span>`;
  nodes.forEach(n => {
    const d = st.dist[n.id];
    const inP = pathSet.has(n.id), isCur = n.id===st.current;
    const isRelaxed = (st.relaxed||[]).includes(n.id);
    const bg = inP?'rgba(6,182,212,.2)': isCur?'rgba(245,158,11,.15)': isRelaxed?'rgba(249,115,22,.15)': d===-1?'rgba(15,23,42,.6)':'rgba(16,185,129,.07)';
    const br = inP?'#06b6d4': isCur?'#f59e0b': isRelaxed?'#f97316':'rgba(51,65,85,.4)';
    svg += `<div style="background:${bg};border:1px solid ${br};border-radius:4px;padding:2px 5px;text-align:center;min-width:30px">
      <div style="font-size:7px;color:#64748b;font-weight:700">${n.short}</div>
      <div style="font-size:9px;font-weight:700;color:${inP?'#22d3ee':d===-1?'#334155':'#cbd5e1'}">${d===-1?'∞':d}</div>
    </div>`;
  });
  svg += `</div>`;

  // ── prev[] display ───────────────────────────────────────
  svg += `<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;max-width:${svgW}px">`;
  svg += `<span style="font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;align-self:center;margin-right:3px">prev[]</span>`;
  nodes.forEach(n => {
    const p = st.prev ? st.prev[n.id] : -1;
    const inP = pathSet.has(n.id);
    const br = inP ? '#06b6d4' : 'rgba(51,65,85,.4)';
    const vc = inP ? '#22d3ee' : p === -1 ? '#334155' : '#94a3b8';
    svg += `<div style="border:1px solid ${br};border-radius:4px;padding:2px 5px;text-align:center;min-width:30px;background:rgba(15,23,42,.5)">
      <div style="font-size:7px;color:#64748b;font-weight:700">${n.short}</div>
      <div style="font-size:9px;font-weight:700;color:${vc}">${p===-1?'—':nodes[p].short}</div>
    </div>`;
  });
  svg += `</div>`;

  // ── Priority Queue ───────────────────────────────────────
  svg += `<div class="traversal-queue"><span class="tq-label">PQ (min-heap):</span>`;
  if (st.pq && st.pq.length) {
    [...st.pq].sort((a,b)=>a.d-b.d).forEach(({id,d}) => {
      svg += `<span class="tq-item" style="background:rgba(245,158,11,.2);border-color:rgba(245,158,11,.4);color:#fbbf24">${nodes[id].short}(${d})</span>`;
    });
  } else {
    svg += `<span style="color:var(--muted);font-size:11px;font-style:italic">empty</span>`;
  }
  svg += `</div>`;

  // ── Settled ──────────────────────────────────────────────
  svg += `<div class="visited-order"><span class="vo-label">Settled:</span>`;
  if (st.visited && st.visited.length) {
    st.visited.forEach(id => {
      svg += `<span class="vo-item" style="background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#86efac">${nodes[id].short}</span>`;
    });
  } else {
    svg += `<span style="color:var(--muted);font-size:11px;font-style:italic">none yet</span>`;
  }
  svg += `</div></div>`;
  return svg;
}
