<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>DS Visualizer — Dev Hub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --dark:#0f172a;--dark2:#1e293b;--dark3:#263148;
      --border:rgba(148,163,184,.15);
      --blue:#3b82f6;--green:#10b981;--orange:#f97316;
      --red:#ef4444;--purple:#8b5cf6;--teal:#14b8a6;--amber:#f59e0b;
      --text:#e2e8f0;--muted:#94a3b8
    }
    html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--dark);color:var(--text)}

    /* HEADER */
    header{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 20px;border-bottom:1px solid var(--border);
      background:rgba(15,23,42,.92);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:100
    }
    .header-left{display:flex;align-items:center;gap:14px}
    .back-btn{
      display:flex;align-items:center;gap:5px;color:var(--muted);
      text-decoration:none;font-size:12px;padding:5px 10px;
      border-radius:7px;border:1px solid var(--border);transition:all .18s
    }
    .back-btn:hover{color:var(--text);border-color:rgba(148,163,184,.4)}
    .page-title{font-size:15px;font-weight:700;color:#f1f5f9}
    .zoom-controls{display:flex;align-items:center;gap:6px}
    .zoom-btn{
      width:28px;height:28px;border:1px solid var(--border);border-radius:6px;
      background:var(--dark2);color:var(--text);cursor:pointer;font-size:14px;
      display:flex;align-items:center;justify-content:center;transition:all .18s
    }
    .zoom-btn:hover{border-color:var(--blue);color:var(--blue)}
    .zoom-label{font-size:11px;color:var(--muted);min-width:38px;text-align:center}

    /* APP LAYOUT */
    .app{
      display:grid;grid-template-columns:210px 1fr 290px;
      height:calc(100vh - 49px);overflow:hidden
    }

    /* LEFT PANEL */
    .left-panel{
      background:var(--dark2);border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden
    }
    .ds-list{flex:1;overflow-y:auto;padding:10px 6px}
    .ds-sec-title{
      font-size:9px;font-weight:700;letter-spacing:1.5px;
      color:var(--muted);text-transform:uppercase;padding:8px 8px 4px
    }
    .ds-btn{
      display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;
      border:none;background:none;color:var(--muted);font-size:12px;
      border-radius:7px;cursor:pointer;text-align:left;transition:all .15s
    }
    .ds-btn:hover{background:rgba(148,163,184,.08);color:var(--text)}
    .ds-btn.active{background:rgba(59,130,246,.15);color:var(--blue);font-weight:600}
    .ds-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* ACTIONS PANEL */
    .actions-panel{
      border-top:1px solid var(--border);padding:10px;
      background:var(--dark2)
    }
    .act-title{
      font-size:9px;font-weight:700;letter-spacing:1px;
      color:var(--muted);text-transform:uppercase;margin-bottom:8px
    }
    .act-input{
      width:100%;padding:6px 10px;border-radius:7px;
      border:1px solid var(--border);background:var(--dark);
      color:var(--text);font-size:12px;margin-bottom:6px
    }
    .act-input:focus{outline:none;border-color:var(--blue)}
    .action-group{display:flex;flex-direction:column;gap:5px}
    .action-row{display:flex;gap:5px}
    .act-btn{
      flex:1;padding:7px 5px;border-radius:7px;
      border:1px solid var(--border);background:var(--dark);
      color:var(--text);font-size:11px;font-weight:600;cursor:pointer;transition:all .18s
    }
    .act-btn:hover{border-color:var(--blue);color:var(--blue)}
    .act-btn.prim{background:var(--blue);border-color:var(--blue);color:#fff}
    .act-btn.prim:hover{background:#2563eb}
    .act-btn.dng{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red)}
    .act-btn.dng:hover{background:var(--red);color:#fff;border-color:var(--red)}
    .act-btn.grn{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.3);color:var(--green)}
    .act-btn.grn:hover{background:var(--green);color:#fff;border-color:var(--green)}
    .act-btn.pur{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.3);color:var(--purple)}
    .act-btn.pur:hover{background:var(--purple);color:#fff;border-color:var(--purple)}

    .step-controls{display:flex;gap:5px;margin-top:8px}
    .step-info{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
    .speed-row{display:flex;align-items:center;gap:6px;margin-top:8px}
    .speed-lbl{font-size:10px;color:var(--muted);white-space:nowrap}
    .speed-slider{flex:1;accent-color:var(--blue);cursor:pointer}

    /* CENTER CANVAS */
    .canvas-panel{overflow:hidden;position:relative;background:var(--dark)}
    .canvas-wrapper{
      width:100%;height:100%;overflow:auto;
      display:flex;align-items:center;justify-content:center
    }
    .canvas-inner{
      transform-origin:center center;transition:transform .1s;
      padding:40px;min-width:500px
    }
    #vizContainer{display:flex;flex-direction:column;align-items:center;gap:20px}
    .step-msg{
      position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
      background:rgba(30,41,59,.97);border:1px solid var(--border);
      border-radius:10px;padding:9px 18px;font-size:12px;color:#f1f5f9;
      text-align:center;min-width:280px;backdrop-filter:blur(8px);z-index:10;
      max-width:80%
    }

    /* RIGHT PANEL */
    .right-panel{
      background:var(--dark2);border-left:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden
    }
    .pseudo-tabs{display:flex;border-bottom:1px solid var(--border)}
    .ptab{
      flex:1;padding:10px 8px;font-size:11px;font-weight:700;
      border:none;background:none;color:var(--muted);cursor:pointer;
      border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.3px
    }
    .ptab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .pseudo-content{flex:1;overflow-y:auto;padding:14px}
    .code-block{
      font-family:'Courier New',monospace;font-size:11.5px;line-height:1.8;
      color:#cbd5e1
    }
    .code-line{padding:0 8px;border-radius:4px;transition:background .2s;white-space:pre;display:block}
    .code-line.hl{
      background:rgba(59,130,246,.18);border-left:3px solid var(--blue);
      padding-left:5px;color:#f1f5f9
    }
    .kw{color:#93c5fd}
    .fn{color:#86efac}
    .cm{color:#475569}
    .num{color:#fbbf24}
    .str{color:#f9a8d4}

    .complexity-box{
      margin-top:12px;padding:10px;background:var(--dark);
      border-radius:8px;border:1px solid var(--border)
    }
    .cx-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
    .cx-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;align-items:center}
    .cx-row span:first-child{color:var(--muted)}
    .cx-green{color:var(--green);font-weight:700}
    .cx-orange{color:var(--orange);font-weight:700}
    .cx-red{color:var(--red);font-weight:700}
    .cx-blue{color:var(--blue);font-weight:700}

    .step-desc-panel{
      padding:10px 14px;border-top:1px solid var(--border);
      font-size:11px;color:var(--muted);min-height:58px;line-height:1.5
    }
    .step-desc-panel b{color:var(--text)}

    /* VISUALIZATIONS */

    /* Array / ArrayList */
    .vis-array-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
    .vis-arr{display:flex;align-items:flex-end;gap:0}
    .arr-cell{display:flex;flex-direction:column;align-items:center}
    .arr-box{
      width:54px;height:54px;border:2px solid rgba(59,130,246,.4);
      background:rgba(59,130,246,.1);display:flex;align-items:center;
      justify-content:center;font-size:15px;font-weight:700;color:#f1f5f9;
      transition:all .4s ease
    }
    .arr-box.empty{opacity:.25;background:transparent}
    .arr-box.hl{background:rgba(59,130,246,.35);border-color:var(--blue);box-shadow:0 0 14px rgba(59,130,246,.4)}
    .arr-box.new{background:rgba(16,185,129,.3);border-color:var(--green);box-shadow:0 0 14px rgba(16,185,129,.4);animation:popIn .4s ease}
    .arr-box.del{background:rgba(239,68,68,.25);border-color:var(--red);box-shadow:0 0 14px rgba(239,68,68,.4)}
    .arr-idx{font-size:10px;color:var(--muted);margin-top:4px}
    .arr-meta{font-size:12px;color:var(--muted)}
    .arr-meta b{color:var(--text)}

    /* LinkedList */
    .vis-ll{display:flex;align-items:center;flex-wrap:wrap;gap:0;padding:10px}
    .ll-node-wrap{display:flex;flex-direction:column;align-items:center}
    .ll-node{display:flex;align-items:center}
    .ll-box{
      display:flex;border:2px solid rgba(139,92,246,.4);border-radius:8px;
      overflow:hidden;transition:all .4s
    }
    .ll-data{
      width:46px;height:46px;background:rgba(139,92,246,.15);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;font-weight:700;color:#f1f5f9
    }
    .ll-ptr{
      width:22px;height:46px;background:rgba(139,92,246,.07);
      border-left:1px solid rgba(139,92,246,.25);
      display:flex;align-items:center;justify-content:center;
      font-size:8px;color:var(--purple)
    }
    .ll-arrow{
      width:36px;height:2px;background:var(--purple);position:relative;margin:0 -1px
    }
    .ll-arrow::after{
      content:'';position:absolute;right:-5px;top:-4px;
      border:4px solid transparent;border-left-color:var(--purple)
    }
    .ll-null{font-size:12px;color:var(--muted);font-style:italic;margin-left:4px}
    .ll-lbl{font-size:9px;color:var(--muted);margin-top:4px;font-weight:700;text-transform:uppercase}
    .ll-box.hl{border-color:var(--green);box-shadow:0 0 12px rgba(16,185,129,.4)}
    .ll-box.new{border-color:var(--green);animation:popIn .4s ease}
    .ll-box.del{border-color:var(--red);box-shadow:0 0 12px rgba(239,68,68,.4)}

    /* Stack */
    .vis-stack-wrap{display:flex;flex-direction:column;align-items:center;gap:0}
    .stack-cell{
      width:150px;height:46px;border:2px solid rgba(16,185,129,.35);
      background:rgba(16,185,129,.08);display:flex;align-items:center;
      justify-content:center;font-size:15px;font-weight:700;color:#f1f5f9;
      border-radius:4px;margin:1px 0;transition:all .4s;position:relative
    }
    .stack-cell.top{border-color:var(--green);background:rgba(16,185,129,.22)}
    .stack-cell.new{animation:slideDown .4s ease;border-color:var(--green)}
    .stack-cell.del{border-color:var(--red);background:rgba(239,68,68,.15)}
    .stack-top-tag{
      position:absolute;right:-62px;font-size:10px;
      color:var(--green);font-weight:700;white-space:nowrap
    }
    .stack-top-tag::before{content:'← TOP'}
    .stack-base{
      width:170px;height:6px;background:var(--dark3);
      border-radius:0 0 6px 6px;border:2px solid rgba(16,185,129,.3);border-top:none
    }
    .stack-empty{
      width:150px;height:46px;border:2px dashed rgba(16,185,129,.2);
      border-radius:4px;display:flex;align-items:center;justify-content:center;
      font-size:11px;color:var(--muted)
    }

    /* Queue */
    .vis-queue-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
    .queue-row{display:flex;align-items:center;gap:0}
    .q-cell{
      width:58px;height:58px;border:2px solid rgba(245,158,11,.3);
      background:rgba(245,158,11,.08);display:flex;align-items:center;
      justify-content:center;font-size:15px;font-weight:700;color:#f1f5f9;
      transition:all .4s
    }
    .q-cell.front{border-color:var(--amber);background:rgba(245,158,11,.22)}
    .q-cell.rear{border-color:var(--orange);background:rgba(249,115,22,.22)}
    .q-cell.new{animation:slideFromRight .4s ease;border-color:var(--green);background:rgba(16,185,129,.18)}
    .q-cell.del{border-color:var(--red);background:rgba(239,68,68,.18)}
    .q-cell.empty-slot{opacity:.2}
    .ptr-row{display:flex;align-items:center;gap:0}
    .ptr-cell{width:58px;text-align:center;font-size:9px;font-weight:700;color:var(--muted)}
    .ptr-cell.fp{color:var(--amber)}
    .ptr-cell.rp{color:var(--orange)}

    /* Deque */
    .vis-deque-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
    .deque-row{display:flex;align-items:center;gap:0}
    .dq-cell{
      width:55px;height:55px;border:2px solid rgba(20,184,166,.3);
      background:rgba(20,184,166,.08);display:flex;align-items:center;
      justify-content:center;font-size:14px;font-weight:700;color:#f1f5f9;
      transition:all .4s
    }
    .dq-cell:first-child{border-radius:8px 0 0 8px}
    .dq-cell:last-child{border-radius:0 8px 8px 0}
    .dq-cell.front{border-color:var(--teal);background:rgba(20,184,166,.22)}
    .dq-cell.rear{border-color:var(--blue);background:rgba(59,130,246,.18)}
    .dq-cell.new{animation:popIn .4s ease}
    .dq-cell.del{border-color:var(--red);background:rgba(239,68,68,.18)}
    .dq-labels{display:flex;justify-content:space-between;width:100%;padding:0 4px}
    .dq-lbl{font-size:10px;font-weight:700}
    .dq-lbl.fl{color:var(--teal)}
    .dq-lbl.rl{color:var(--blue)}

    /* Circular Queue */
    .vis-circ{position:relative}
    .circ-svg{display:block}

    /* BFS/DFS */
    .vis-graph{display:flex;flex-direction:column;align-items:center;gap:16px}
    .graph-svg{display:block}
    .traversal-queue{
      display:flex;align-items:center;gap:8px;padding:8px 16px;
      background:var(--dark2);border-radius:8px;border:1px solid var(--border);
      font-size:11px
    }
    .tq-label{color:var(--muted);font-weight:700;margin-right:4px}
    .tq-item{
      padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px
    }
    .visited-order{
      display:flex;align-items:center;gap:4px;font-size:11px
    }
    .vo-label{color:var(--muted);font-weight:700}
    .vo-item{
      padding:3px 8px;background:rgba(16,185,129,.15);
      border:1px solid rgba(16,185,129,.3);border-radius:5px;
      color:var(--green);font-weight:700;font-size:11px
    }

    /* Heap */
    .vis-heap{display:flex;flex-direction:column;align-items:center;gap:14px}
    .heap-svg{display:block}
    .heap-arr{
      display:flex;align-items:center;gap:3px;
      padding:8px 12px;background:var(--dark2);
      border-radius:8px;border:1px solid var(--border)
    }
    .ha-lbl{font-size:10px;color:var(--muted);margin-right:4px}
    .ha-cell{
      width:36px;height:36px;border:2px solid rgba(139,92,246,.35);
      background:rgba(139,92,246,.1);border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;color:#f1f5f9;transition:all .4s
    }
    .ha-cell.hl{background:rgba(59,130,246,.3);border-color:var(--blue)}
    .ha-cell.new{background:rgba(16,185,129,.3);border-color:var(--green);animation:popIn .4s}
    .ha-cell.del{background:rgba(239,68,68,.25);border-color:var(--red)}
    .ha-cell.swap{background:rgba(245,158,11,.3);border-color:var(--amber)}

    /* Animations */
    @keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
    @keyframes slideDown{0%{transform:translateY(-40px);opacity:0}100%{transform:translateY(0);opacity:1}}
    @keyframes slideFromRight{0%{transform:translateX(60px);opacity:0}100%{transform:translateX(0);opacity:1}}
    @keyframes fadeOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 8px rgba(59,130,246,0)}}

    /* Scrollbar */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--dark3);border-radius:3px}

    @media(max-width:900px){
      .app{grid-template-columns:190px 1fr 240px}
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-btn" href="../index.html">← Home</a>
    <span class="page-title">Data Structure Visualizer</span>
  </div>
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="doZoom(-0.1)" title="Zoom out">-</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="zoom-btn" onclick="doZoom(0.1)" title="Zoom in">+</button>
    <button class="zoom-btn" onclick="doZoom(0,'reset')" title="Reset zoom" style="font-size:11px">↺</button>
  </div>
</header>

<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="ds-list" id="dsList"></div>
    <div class="actions-panel" id="actionsPanel">
      <div class="act-title">Actions</div>
      <div style="font-size:11px;color:var(--muted)">Select a structure</div>
    </div>
  </div>

  <!-- CENTER CANVAS -->
  <div class="canvas-panel">
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="canvas-inner" id="canvasInner">
        <div id="vizContainer">
          <div style="text-align:center;color:var(--muted);padding:60px 0">
            <div style="font-size:40px;margin-bottom:16px">⬅</div>
            <div style="font-size:15px;color:#94a3b8">Select a data structure to begin visualization</div>
          </div>
        </div>
      </div>
    </div>
    <div class="step-msg" id="stepMsg" style="display:none"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="pseudo-tabs">
      <button class="ptab active" id="tabCode" onclick="switchTab('code')">Pseudo Code</button>
      <button class="ptab" id="tabCx" onclick="switchTab('cx')">Complexity</button>
    </div>
    <div class="pseudo-content" id="pseudoContent">
      <div style="font-size:12px;color:var(--muted);padding:10px 0">Select a structure to see pseudo code.</div>
    </div>
    <div class="step-desc-panel" id="stepDescPanel">Click an action to see step-by-step explanation.</div>
  </div>
</div>

<script>
/* =====================================================================
   GLOBAL STATE
   ===================================================================== */
let currentDS = null;
let currentState = null;
let frames = [];
let frameIdx = 0;
let playing = false;
let playTimer = null;
let zoom = 1;
let currentTab = 'code';
let currentAction = null;

/* =====================================================================
   ZOOM
   ===================================================================== */
function doZoom(delta, mode) {
  if (mode === 'reset') zoom = 1;
  else zoom = Math.min(3, Math.max(0.3, zoom + delta));
  document.getElementById('canvasInner').style.transform = `scale(${zoom})`;
  document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
}
document.getElementById('canvasWrapper').addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); doZoom(e.deltaY < 0 ? 0.1 : -0.1); }
}, { passive: false });

/* =====================================================================
   SWITCH TAB
   ===================================================================== */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabCode').classList.toggle('active', tab === 'code');
  document.getElementById('tabCx').classList.toggle('active', tab === 'cx');
  if (currentDS) renderRight();
}

/* =====================================================================
   DS DEFINITIONS
   ===================================================================== */
const DS_LIST = [
  { id: 'array',    label: 'Array',          color: '#3b82f6', group: 'Linear' },
  { id: 'arraylist',label: 'ArrayList',       color: '#06b6d4', group: 'Linear' },
  { id: 'linkedlist',label:'Linked List',     color: '#8b5cf6', group: 'Linear' },
  { id: 'stack',    label: 'Stack',           color: '#10b981', group: 'Linear' },
  { id: 'queue',    label: 'Queue',           color: '#f59e0b', group: 'Linear' },
  { id: 'deque',    label: 'Deque',           color: '#14b8a6', group: 'Linear' },
  { id: 'circqueue',label: 'Circular Queue',  color: '#ec4899', group: 'Linear' },
  { id: 'bfs',      label: 'BFS',             color: '#22d3ee', group: 'Graph' },
  { id: 'dfs',      label: 'DFS',             color: '#a78bfa', group: 'Graph' },
  { id: 'dijkstra', label: 'Dijkstra',        color: '#f59e0b', group: 'Graph' },
  { id: 'heap',     label: 'Min-Heap',        color: '#fb923c', group: 'Tree' },
];

const PSEUDOCODES = {
  array: {
    add:`add(arr, value):
  <span class="cm">// O(1) — append to end</span>
  <span class="kw">if</span> arr.size == arr.capacity:
    <span class="kw">throw</span> FullException
  arr[arr.size] = value
  arr.size++`,
    remove:`remove(arr, index):
  <span class="cm">// O(n) — shift left from index</span>
  <span class="kw">if</span> arr.size == 0:
    <span class="kw">throw</span> EmptyException
  value = arr[index]
  <span class="kw">for</span> i = index <span class="kw">to</span> arr.size-2:
    arr[i] = arr[i+1]
  arr.size--
  <span class="kw">return</span> value`,

/* =====================================================================
   INIT STATE
   ===================================================================== */
function initState(dsId) {
  switch(dsId) {
    case 'array':
      return { items:[10,20,30,40,50], capacity:8, hl:[], newIdx:-1, delIdx:-1 };
    case 'arraylist':
      return { items:[10,20,30], capacity:4, hl:[], newIdx:-1, delIdx:-1, resizing:false };
    case 'linkedlist':
      return { nodes:[{v:10},{v:20},{v:30}], hl:[], newIdx:-1, delIdx:-1 };
    case 'stack':
      return { items:[10,20,30], hl:[], newTop:false, delTop:false };
    case 'queue':
      return { items:[10,20,30], capacity:6, hl:[], newIdx:-1, delIdx:-1 };
    case 'deque':
      return { items:[10,20,30], hl:[], newFront:false, newRear:false, delFront:false, delRear:false };
    case 'circqueue':
      return { slots:Array(8).fill(null), front:0, rear:2, size:3, capacity:8, hl:[], newIdx:-1, delIdx:-1, overIdx:-1,
               items:[10,20,30], // logical items for display
               overwriteMode: false, // audio buffer: overwrite oldest when full
             };
    case 'bfs': {
      const G = buildGraph();
      return { nodes:G.nodes, edges:G.edges, visited:[], queued:[], current:-1, visitOrder:[] };
    }
    case 'dfs': {
      const G = buildGraph();
      return { nodes:G.nodes, edges:G.edges, visited:[], stack:[], current:-1, visitOrder:[] };
    }
    case 'dijkstra': {
      const CG = buildCityGraph();
      return {
        nodes: CG.nodes, edges: CG.edges,
        dist: CG.nodes.map((_,i) => i===0 ? 0 : -1),
        prev: CG.nodes.map(() => -1),
        pq: [{d:0, id:0}],
        visited: [], current: -1, relaxed: [], path: [],
      };
    }
    case 'heap':
      return { items:[5,12,8,20,15,10], hl:[], swapA:-1, swapB:-1, newIdx:-1, delIdx:-1 };
    default:
      return {};
  }
}

function renderDSList() {
  const container = document.getElementById('dsList');

/* =====================================================================
